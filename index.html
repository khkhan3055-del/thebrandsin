<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081321">
<title>The Brands Inn — Coming Soon</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    display: grid;
    grid-template-rows: 1fr auto;
    background: #101820;
    color: #202020;
    font: 1rem/1.5 "Century Gothic", "Avenir Next", Futura, sans-serif;
  }
  .backdrop, .backdrop img, .backdrop::after { position: fixed; inset: 0; }
  .backdrop { z-index: -1; }
  .backdrop img { width: 100%; height: 100%; object-fit: cover; }
  .backdrop::after { content: ""; background: #10182080; }
  .architecture { opacity: 0; animation: crossfade 28s ease-in-out infinite; }
  @keyframes crossfade {
    0%, 40%, 100% { opacity: 0; }
    50%, 90% { opacity: 1; }
  }
  .paused .architecture { animation-play-state: paused; }
  main {
    place-self: center;
    width: min(650px, calc(100% - 32px));
    margin-block: 24px;
    padding: clamp(24px, 6vw, 58px);
    background: #fcfcfc;
    text-align: center;
  }
  .logo {
    position: relative;
    overflow: hidden;
    width: min(100%, 350px);
    aspect-ratio: 3 / 1;
    margin: 0 auto 30px;
  }
  .logo img {
    position: absolute;
    width: 138%;
    height: auto;
    top: -145%;
    left: -28%;
  }
  .status, label { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; }
  .status { margin: 0; }
  h1 { margin: 10px 0 26px; font-size: clamp(1.55rem, 5vw, 2.7rem); line-height: 1.15; }
  h1 span { display: block; }
  .progress { width: min(100%, 300px); margin-inline: auto; }
  .progress-heading { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  progress { appearance: none; display: block; width: 100%; height: 6px; border: 0; border-radius: 6px; overflow: hidden; background: #ddd; }
  progress::-webkit-progress-bar { background: transparent; }
  progress::-webkit-progress-value { background: #202020; }
  progress::-moz-progress-bar { background: #202020; }
  .thanks { margin: 24px 0 0; }
  .smile { margin-right: 6px; font-size: 1.3em; }
  footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 8px 20px;
    padding: 12px 16px;
    background: #101820;
    color: #fff;
    font-size: .8rem;
    text-align: center;
  }
  button { min-height: 44px; padding: 0 12px; background: transparent; border: 1px solid #fff8; color: inherit; font: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) {
    .architecture { animation: none; }
    #slideshow { display: none; }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <img src="earth.jpg" alt="" fetchpriority="high">
    <img class="architecture" src="architecture.jpg" alt="">
  </div>
  <main>
    <div class="logo"><img src="brands-inn.png" alt="The Brands Inn — The global brands directory" width="2000" height="2000"></div>
    <p class="status">Coming soon</p>
    <h1>Creating BrandsInn <span>for Brands Worldwide</span></h1>
    <div class="progress">
      <div class="progress-heading">
        <label for="launch-progress">Launch progress</label>
        <strong aria-hidden="true">30%</strong>
      </div>
      <progress id="launch-progress" value="30" max="100">30%</progress>
    </div>
    <p class="thanks"><span class="smile" aria-hidden="true">☺</span> Thank you for visiting us.</p>
  </main>
  <footer>
    <span>© The Brands Inn. All rights reserved.</span>
    <button id="slideshow" type="button" hidden>Pause slideshow</button>
  </footer>
  <script>
    const slideshow = document.querySelector('#slideshow');
    slideshow.hidden = false;
    slideshow.addEventListener('click', () => {
      const paused = document.body.classList.toggle('paused');
      slideshow.textContent = paused ? 'Resume slideshow' : 'Pause slideshow';
    });
  </script>
</body>
</html>
