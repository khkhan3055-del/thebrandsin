<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="The Brands In is coming soon.">
  <meta name="theme-color" content="#182722">
  <title>The Brands In — Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(12px, 3vw, 40px);
      background: #182722;
      color: #f7f1df;
      font: 1rem/1.5 system-ui, sans-serif;
    }
    .frame {
      min-height: calc(100vh - 2 * clamp(12px, 3vw, 40px));
      min-height: calc(100svh - 2 * clamp(12px, 3vw, 40px));
      display: grid;
      grid-template-rows: auto 1fr;
      border: 1px solid #748475;
      background: radial-gradient(ellipse at 75% 90%, #344937, transparent 70%);
      padding: clamp(20px, 5vw, 72px);
    }
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: .875rem;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border: 1px solid #d9e5aa;
      border-radius: 50%;
      color: #d9e5aa;
      font: italic 1.2rem Georgia, serif;
      letter-spacing: -.06em;
      text-transform: none;
    }
    main {
      display: grid;
      align-content: center;
      justify-items: center;
      text-align: center;
      padding-block: clamp(56px, 10vh, 120px);
    }
    .ornament {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #d9e5aa;
    }
    .ornament::before, .ornament::after {
      content: "";
      width: clamp(25px, 6vw, 80px);
      height: 1px;
      background: currentColor;
    }
    h1 {
      margin: .18em 0 .24em;
      font: 400 clamp(3.25rem, 12vw, 11rem)/.9 Georgia, serif;
      letter-spacing: -.065em;
    }
    h1 em { color: #d9e5aa; }
    p { margin: 0; max-width: 34ch; color: #e3e5d6; }
    @media (max-width: 580px) {
      h1 em { display: block; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <header>
      <span class="mark" aria-hidden="true">In</span>
      The Brands In
    </header>
    <main>
      <span class="ornament" aria-hidden="true">✦</span>
      <h1>Coming <em>soon</em></h1>
      <p>We’re getting the site ready. Check back for our launch.</p>
    </main>
  </div>
</body>
</html>
